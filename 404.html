<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
    <link rel="icon" href="/assets/favicon.png?v=2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a202c; /* Warna latar belakang gelap kebiruan */
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #a0aec0; /* Warna teks abu-abu terang */
        }

        .error-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .error-code {
            font-size: 24px;
            font-weight: 500;
            padding-right: 20px;
            border-right: 1px solid #4a5568; /* Garis vertikal pemisah */
        }

        .error-message {
            font-size: 16px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Not Found</div>
    </div>

</body>
</html>
